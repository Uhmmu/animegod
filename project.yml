name: AnimeGod
options:
  bundleIdPrefix: com.uhmmu
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  developmentLanguage: en
packages:
  AnimeGodCore:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  AnimeGod:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AnimeGodCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uhmmu.AnimeGod
        PRODUCT_NAME: AnimeGod
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnimeGod
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Uhmmu
        CODE_SIGN_ENTITLEMENTS: App/AnimeGod.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # Embedded BitTorrent engine: libtorrent + OpenSSL are built as
        # Universal static libraries by scripts/build-libtorrent.sh into
        # Vendor/ (gitignored). The defines must match how the library was
        # compiled, or its public headers describe a different ABI.
        SWIFT_OBJC_BRIDGING_HEADER: App/Torrent/Engine/AnimeGod-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/libtorrent/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/libtorrent/lib
        # SystemConfiguration: libtorrent watches for IP changes through it.
        OTHER_LDFLAGS: -ltorrent-rasterbar -lssl -lcrypto -framework SystemConfiguration
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) TORRENT_USE_OPENSSL=1 TORRENT_USE_LIBCRYPTO=1 TORRENT_SSL_PEERS=1 BOOST_ASIO_ENABLE_CANCELIO=1 BOOST_ASIO_HAS_STD_CHRONO=1 BOOST_ASIO_NO_DEPRECATED=1 BOOST_EXCEPTION_DISABLE=1 _FILE_OFFSET_BITS=64
    scheme:
      testTargets: []

  # The iPhone companion. Design: docs/IOS_COMPANION_PLAN.md.
  #
  # Deliberately does NOT depend on MPVKit yet: playback is Phase 3, and
  # pulling the iOS xcframework slices in would cost a large download for a
  # target that currently has no player. AnimeGodCore carries the models,
  # LibraryDatabase and every query, which is the whole point of it having no
  # AppKit imports.
  #
  # Signing is left empty so the simulator builds with no team. A real device
  # needs a development team filled in here.
  AnimeGodMobile:
    type: application
    platform: iOS
    sources:
      - path: Mobile
    dependencies:
      - package: AnimeGodCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uhmmu.AnimeGod
        PRODUCT_NAME: AnimeGod
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnimeGod
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: AnimeGod finds your Mac on the same Wi-Fi network to mirror your library and stream episodes.
        INFOPLIST_KEY_NSBonjourServices: _animegod._tcp
        INFOPLIST_KEY_UIBackgroundModes: audio
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
