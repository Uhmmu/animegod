name: AnimeGod
options:
  bundleIdPrefix: com.uhmmu
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
packages:
  AnimeGodCore:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  AnimeGod:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AnimeGodCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uhmmu.AnimeGod
        PRODUCT_NAME: AnimeGod
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnimeGod
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Uhmmu
        CODE_SIGN_ENTITLEMENTS: App/AnimeGod.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets: []
