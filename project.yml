name: AnimeGod
options:
  bundleIdPrefix: com.uhmmu
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  developmentLanguage: en
packages:
  AnimeGodCore:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  AnimeGod:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AnimeGodCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uhmmu.AnimeGod
        PRODUCT_NAME: AnimeGod
        MARKETING_VERSION: 0.6.1
        CURRENT_PROJECT_VERSION: 14
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnimeGod
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Uhmmu
        CODE_SIGN_ENTITLEMENTS: App/AnimeGod.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # Embedded BitTorrent engine: libtorrent + OpenSSL are built as
        # Universal static libraries by scripts/build-libtorrent.sh into
        # Vendor/ (gitignored). The defines must match how the library was
        # compiled, or its public headers describe a different ABI.
        SWIFT_OBJC_BRIDGING_HEADER: App/Torrent/Engine/AnimeGod-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/libtorrent/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/libtorrent/lib
        # SystemConfiguration: libtorrent watches for IP changes through it.
        OTHER_LDFLAGS: -ltorrent-rasterbar -lssl -lcrypto -framework SystemConfiguration
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) TORRENT_USE_OPENSSL=1 TORRENT_USE_LIBCRYPTO=1 TORRENT_SSL_PEERS=1 BOOST_ASIO_ENABLE_CANCELIO=1 BOOST_ASIO_HAS_STD_CHRONO=1 BOOST_ASIO_NO_DEPRECATED=1 BOOST_EXCEPTION_DISABLE=1 _FILE_OFFSET_BITS=64
    scheme:
      testTargets: []

  # The iPhone companion. Design: docs/IOS_COMPANION_PLAN.md.
  #
  # MPVKit (LGPL — never MPVKit-GPL) carries libmpv for iOS too, so the phone
  # plays with the same engine as the Mac and nothing is transcoded.
  #
  # Signing is left empty so the simulator builds with no team. A real device
  # needs a development team filled in here.
  AnimeGodMobile:
    type: application
    platform: iOS
    sources:
      - path: Mobile
    dependencies:
      - package: AnimeGodCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uhmmu.AnimeGod
        PRODUCT_NAME: AnimeGod
        MARKETING_VERSION: 0.6.1
        CURRENT_PROJECT_VERSION: 14
        SWIFT_STRICT_CONCURRENCY: complete
        # Signed with the development team, so the app runs on a real device
        # and the Keychain works. Unsigned, there is no
        # application-identifier entitlement and every Keychain call fails
        # with errSecMissingEntitlement (-34018) — which is how the paired
        # token silently vanished on the very first simulator run.
        #
        # This is a personal team, so a build is provisioned for seven days:
        # after that the app refuses to launch until it is reinstalled.
        DEVELOPMENT_TEAM: P25QK6239P
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: AnimeGod
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The accelerometer, and only so the player can notice that the phone
        # is being held sideways while rotation is locked.
        NSMotionUsageDescription: AnimeGod uses the motion sensor to notice when you turn the phone, so it can offer to rotate the video even while rotation is locked.
        NSLocalNetworkUsageDescription: AnimeGod finds your Mac on this Wi-Fi network to show your library and stream episodes from it.
        NSBonjourServices: [_animegod._tcp]
        # The link is plain HTTP to the user's own Mac. Off the local network
        # it is reached through Tailscale, which is already WireGuard
        # encrypted end to end; TLS with a cert pinned at pairing is the
        # Phase 6 answer for untrusted LANs. Scoped to local networking rather
        # than opening arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets: []
